version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: my_postgres_pet_clinic
    restart: always
    environment:
      POSTGRES_DB: pet_clinic
      POSTGRES_USER: pet_clinic
      POSTGRES_PASSWORD: petclinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_postgres:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:6.0
    container_name: my_mongo_pet_clinic
    restart: always
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: petclinic
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init_mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

volumes:
  postgres_data:
  mongo_data:
