version: '3.8'

services:
  web-forgery:
    image: node:18-alpine
    working_dir: /srv
    volumes:
      - ./static:/srv       # mount local “static” dir into /srv in the container
    ports:
      - "8001:8001"         # expose container’s 8001 on host 8001
    command: >
      npx --yes http-server . -p 8001