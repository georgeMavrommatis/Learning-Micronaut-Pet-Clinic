<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!doctype html>
        <html lang="en">
        <head>
        <meta charset="utf-8" />
        <title>Login (JSON → /login)</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 580px; margin: 2rem auto; }
        label { display:block; margin-top: 1rem; }
        button { margin-top: 1rem; }
        pre { background:#f6f6f6; padding:.75rem; overflow:auto; }
    </style>
</head>
<body>
<h1>Login</h1>

<label>Username <input id="username" value="alice" /></label>
<label>Password <input id="password" type="password" value="alice@1" /></label>
<button id="login">Log in</button>

<h3>Result</h3>
<pre id="out"></pre>

<script>
    const API = 'http://127.0.0.1:8080';

    async function login() {
      const body = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      const res = await fetch(`${API}/login`, {
        method: 'POST',
        credentials: 'include', // accept Set-Cookie (session) from 8080
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const text = await res.text().catch(() => '');
      document.getElementById('out').textContent =
        `Status: ${res.status} ${res.statusText}\n\n${text}`;
    }

    document.getElementById('login').addEventListener('click', login);
</script>
</body>
</html>
</title>
