components:
  schemas:
    CreateVetRequest:
      type: object
      properties:
        firstName:
          $ref: './components-properties.yml#/components/properties/firstName'
        lastName:
          $ref: './components-properties.yml#/components/properties/lastName'
        specialties:
          $ref: './components-properties.yml#/components/properties/specialties'
      required:
        - firstName
        - lastName
        - specialties

    UpdateVetRequest:
      type: object
      properties:
        firstName:
          $ref: './components-properties.yml#/components/properties/firstName'
        lastName:
          $ref: './components-properties.yml#/components/properties/lastName'
        specialties:
          $ref: './components-properties.yml#/components/properties/specialties'
      required:
        - firstName
        - lastName
        - specialties

    VetResponse:
      type: object
      properties:
        id:
          $ref: './components-properties.yml#/components/properties/id'
        firstName:
          $ref: './components-properties.yml#/components/properties/firstName'
        lastName:
          $ref: './components-properties.yml#/components/properties/lastName'
        specialties:
          $ref: './components-properties.yml#/components/properties/specialties'