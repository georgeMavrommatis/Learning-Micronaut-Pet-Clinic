components:
  properties:
    firstName:
      type: string
      minLength: 1
      description: Vet's first name

    lastName:
      type: string
      minLength: 1
      description: Vet's last name

    specialties:
      type: array
      items:
        type: string
      minItems: 1
      maxItems: 100
      uniqueItems: true
      description: List of vet specialties

    id:
      type: integer
      minimum: 0
      description: Vet unique identifier
