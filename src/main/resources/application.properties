#Thu Jun 19 11:22:17 UTC 2025
#The application name - Reference: https://docs.micronaut.io/latest/guide/configurationreference.html#io.micronaut.runtime.ApplicationConfiguration
micronaut.application.name=pet-clinic

# Database connection - Reference: https://micronaut-projects.github.io/micronaut-sql/latest/guide/configurationreference.html#io.micronaut.configuration.jdbc.dbcp.DatasourceConfiguration
datasources.postgresql1.url=jdbc:postgresql://localhost:5432/pet_clinic
datasources.postgresql1.username=pet_clinic
datasources.postgresql1.password=petclinic
datasources.postgresql1.driver-class-name=org.postgresql.Driver
datasources.postgresql1.dialect=POSTGRES

# Database connection
datasources.postgresql2.url=jdbc:postgresql://localhost:5433/pet_clinic
datasources.postgresql2.username=pet_clinic
datasources.postgresql2.password=petclinic
datasources.postgresql2.driver-class-name=org.postgresql.Driver
datasources.postgresql2.dialect=POSTGRES

# JPA settings
# Packages to scan for @Entity classes - Reference: https://micronaut-projects.github.io/micronaut-sql/latest/guide/configurationreference.html#io.micronaut.configuration.hibernate.jpa.JpaConfiguration$EntityScanConfiguration
jpa.default.entity-scan.packages=com.gmavrommatis.config.domain.l1
# Hibernate dialect to use (tells Hibernate how to speak Postgres SQL) - Reference: https://micronaut-projects.github.io/micronaut-sql/latest/guide/configurationreference.html#io.micronaut.configuration.hibernate.jpa.JpaConfiguration$EntityScanConfiguration
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Schema generation strategy: 'update' will apply any missing columns/tables on startup - Reference: https://guides.micronaut.io/latest/micronaut-jpa-hibernate-gradle-java.html#:~:text=jpa.default.properties.hibernate.hbm2ddl.auto%3Dupdate
jpa.default.properties.hibernate.hbm2ddl.auto=update
# Log the SQL statements Hibernate executes (useful for debugging) - Reference: https://guides.micronaut.io/latest/micronaut-jpa-hibernate-gradle-java.html#:~:text=jpa.default.properties.hibernate.hbm2ddl.auto%3Dupdate
jpa.default.properties.hibernate.show_sql=true


# JPA for datasource 1
jpa.postgresql1.entity-scan.packages=com.gmavrommatis.config.domain.l1
jpa.postgresql1.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jpa.postgresql1.properties.hibernate.hbm2ddl.auto=update
jpa.postgresql1.properties.hibernate.show_sql=true

# JPA for datasource 2
jpa.postgresql2.entity-scan.packages=com.gmavrommatis.config.domain.l1
jpa.postgresql2.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jpa.postgresql2.properties.hibernate.hbm2ddl.auto=update
jpa.postgresql2.properties.hibernate.show_sql=true

#Reference: https://docs.micronaut.io/latest/guide/configurationreference.html#io.micronaut.http.server.HttpServerConfiguration
micronaut.server.thread-selection=AUTO